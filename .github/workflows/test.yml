env:
  RUBY_VERSION: 3.1.2
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  DATABASE_USER: postgres
  DATABASE_PASSWORD: password
  DATABASE_HOST: localhost
  RAILS_ENV: test

name: Rails tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  rspec-test:
    name: RSpec
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:12
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Create database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
      - name: Run tests
        run: bundle exec rspec
      - name: Run brakeman
        run: bundle exec brakeman --no-exit-on-warn --no-exit-on-error -o brakeman.txt
      # Style report only: the inherited codebase has never been rubocop-clean, so
      # offences are uploaded as an artifact instead of blocking. RSpec is the gate.
      - name: Run rubocop (report only)
        continue-on-error: true
        run: bundle exec rubocop --format offenses --format progress --out rubocop.txt
      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
      - name: Upload rubocop report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubocop-report
          path: rubocop.txt
          if-no-files-found: ignore
      - name: Upload brakeman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakeman-report
          path: brakeman.txt
          if-no-files-found: ignore

  # Deploys only after the RSpec job passes, and only for pushes to main.
  # Needs two repository secrets: HEROKU_API_KEY and HEROKU_APP_NAME.
  # When they are not configured (e.g. on a fork) the job succeeds without deploying.
  deploy:
    name: Deploy to Heroku
    needs: rspec-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Skip when Heroku secrets are not configured
        if: env.HEROKU_API_KEY == '' || env.HEROKU_APP_NAME == ''
        run: echo "::notice::HEROKU_API_KEY / HEROKU_APP_NAME not set; skipping Heroku deploy."
      - uses: actions/checkout@v4
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        with:
          fetch-depth: 0
      - name: Push to Heroku (Procfile release phase runs db:migrate)
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        run: |
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:refs/heads/main
